name: generate snake animation

on:
  schedule:
    # UTC 41 */6 * * * -> 北京时间 01:41 / 07:41 / 13:41 / 19:41（避开整点高负载）
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d4577f&color_dots=#f7eef4,#fbd3e6,#f4b0d3,#e58bb9,#cf5f9d
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f5c2e7&color_dots=#1f1e2b,#3a2c44,#5f3a5e,#934b81,#d16aa9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
